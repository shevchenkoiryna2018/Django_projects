{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="comment-box">
                <h4 class="mb-4">Create new post</h4>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-accent">
                        Publish
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
